<!DOCTYPE html>
<html>
<head>
<title>Shop - PineBoyDesignz</title>
<link rel="stylesheet" href="style.css">
<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0a0a0a;
    color: white;
    text-align: center;
}

/* NAV */
nav {
    padding: 15px;
    background: #111;
}

nav a {
    color: white;
    margin: 0 15px;
    text-decoration: none;
}

/* TITLE */
h1 {
    margin-top: 40px;
    letter-spacing: 3px;
}

/* PRODUCTS */
.products {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 40px;
}

.card {
    background: #151515;
    width: 260px;
    padding: 15px;
    border-radius: 12px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-8px);
    background: #1c1c1c;
}

.card img {
    width: 100%;
    border-radius: 10px;
}

.card h3 {
    margin: 10px 0 5px 0;
}

.price {
    color: #1f7a1f;
    font-weight: bold;
}

.btn {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 18px;
    background: white;
    color: black;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
}

/* MOBILE */
@media (max-width: 768px) {
    .products {
        flex-direction: column;
        align-items: center;
    }

    .card {
        width: 90%;
    }
}
</style>

</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
</nav>

<h1>NEW DROP</h1>

<div class="products">

    <div class="card">
        <img src="https://via.placeholder.com/300">
        <h3>PineBoy Tee</h3>
        <p class="price">$24.99</p>
        <a class="btn" href="tee.html">View Product</a>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/300">
        <h3>PineBoy Hoodie</h3>
        <p class="price">$39.99</p>
        <a class="btn" href="hoodie.html">View Product</a>
    </div>

</div>

</body>
</html>
