<!DOCTYPE html>
<html>
<head>
<title>PineBoyDesignz</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0a0a0a;
    color: white;
    text-align: center;
}

/* HERO */
.hero {
    padding: 120px 20px;
    background: radial-gradient(circle, #1a1a1a, #000);
}

h1 {
    font-size: 70px;
    margin: 0;
    letter-spacing: 8px;
}

p {
    color: #aaa;
    letter-spacing: 3px;
}

.tag {
    color: #1f7a1f;
    margin-top: 10px;
}

.btn {
    display: inline-block;
    margin-top: 25px;
    padding: 12px 25px;
    background: #1f7a1f;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

/* PRODUCTS */
.products {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    padding: 40px;
}

.card {
    background: #151515;
    width: 250px;
    padding: 15px;
    border-radius: 10px;
}

.card img {
    width: 100%;
    border-radius: 10px;
}

.price {
    color: #1f7a1f;
    font-weight: bold;
}

/* MOBILE */
@media (max-width: 768px) {
    .products {
        flex-direction: column;
        align-items: center;
    }

    .card {
        width: 90%;
    }
}
</style>

</head>

<body>

<div class="hero">
    <h1>PINEBOY</h1>
    <p>PINEBOY4LIFE</p>
    <div class="tag">STREETWEAR BRAND</div>
    <a class="btn" href="#shop">SHOP NOW</a>
</div>

<h2 style="margin-top:50px;">FEATURED DROP</h2>

<div id="shop" class="products">

    <div class="card">
        <img src="https://via.placeholder.com/300">
        <h3>PineBoy Tee</h3>
        <p class="price">$24.99</p>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/300">
        <h3>PineBoy Hoodie</h3>
        <p class="price">$39.99</p>
    </div>

</div>

</body>
</html>
